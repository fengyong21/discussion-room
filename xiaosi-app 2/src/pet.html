<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小司</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    cursor: default;
    user-select: none;
    -webkit-app-region: no-drag;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* ===== 宠物容器 ===== */
  #pet {
    position: absolute;
    width: 80px;
    height: 80px;
    cursor: grab;
    z-index: 99999;
    transition: filter 0.3s;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
  }
  #pet:active { cursor: grabbing; }
  #pet.sleeping { animation: sleeping 2s ease-in-out infinite; }

  @keyframes sleeping {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.05) rotate(2deg); }
  }

  /* ===== 宠物身体 ===== */
  .pet-body {
    position: relative;
    width: 80px;
    height: 80px;
  }

  .pet-head {
    width: 70px;
    height: 65px;
    background: linear-gradient(135deg, #6C5CE7, #a29bfe);
    border-radius: 50% 50% 45% 45%;
    position: absolute;
    top: 0;
    left: 5px;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1), inset 5px 5px 15px rgba(255,255,255,0.2);
  }

  .pet-eye {
    width: 14px;
    height: 16px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 18px;
    overflow: hidden;
  }
  .pet-eye.left { left: 15px; }
  .pet-eye.right { right: 15px; }

  .pet-pupil {
    width: 8px;
    height: 8px;
    background: #2d3436;
    border-radius: 50%;
    position: absolute;
    top: 4px;
    left: 3px;
    transition: transform 0.1s;
  }
  .pet-pupil::after {
    content: '';
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 1px;
    left: 1px;
  }

  .pet-eye.blink {
    height: 3px;
    top: 24px;
    transition: height 0.1s;
  }

  .pet-mouth {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 6px;
    border-bottom: 3px solid #2d3436;
    border-radius: 0 0 50% 50%;
    transition: all 0.3s;
  }
  .pet-mouth.happy {
    width: 16px;
    height: 8px;
    border-bottom: 3px solid #2d3436;
  }
  .pet-mouth.sad {
    border-bottom: none;
    border-top: 3px solid #2d3436;
    border-radius: 50% 50% 0 0;
    width: 12px;
    height: 5px;
  }
  .pet-mouth.open {
    width: 10px;
    height: 10px;
    background: #2d3436;
    border-radius: 50%;
    border: none;
  }

  .pet-blush {
    width: 10px;
    height: 6px;
    background: rgba(255, 150, 150, 0.5);
    border-radius: 50%;
    position: absolute;
    top: 32px;
  }
  .pet-blush.left { left: 6px; }
  .pet-blush.right { right: 6px; }

  .pet-ear {
    width: 18px;
    height: 22px;
    background: linear-gradient(135deg, #6C5CE7, #a29bfe);
    border-radius: 50% 50% 0 0;
    position: absolute;
    top: -12px;
  }
  .pet-ear.left { left: 10px; transform: rotate(-15deg); }
  .pet-ear.right { right: 10px; transform: rotate(15deg); }
  .pet-ear::after {
    content: '';
    width: 10px;
    height: 14px;
    background: #dfe6e9;
    border-radius: 50% 50% 0 0;
    position: absolute;
    bottom: 2px;
    left: 4px;
  }

  .pet-torso {
    width: 50px;
    height: 30px;
    background: linear-gradient(135deg, #6C5CE7, #a29bfe);
    border-radius: 40% 40% 50% 50%;
    position: absolute;
    bottom: 0;
    left: 15px;
  }

  .pet-foot {
    width: 16px;
    height: 8px;
    background: #5a4bd1;
    border-radius: 50%;
    position: absolute;
    bottom: -2px;
  }
  .pet-foot.left { left: 18px; }
  .pet-foot.right { right: 18px; }

  /* 走路动画 */
  .walking .pet-foot.left { animation: walkLeft 0.3s ease-in-out infinite; }
  .walking .pet-foot.right { animation: walkRight 0.3s ease-in-out infinite; }
  .walking .pet-body { animation: walkBounce 0.3s ease-in-out infinite; }

  @keyframes walkLeft {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-5px); }
  }
  @keyframes walkRight {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(5px); }
  }
  @keyframes walkBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .jumping .pet-body {
    animation: jump 0.5s ease-out;
  }
  @keyframes jump {
    0% { transform: translateY(0) scale(1, 1); }
    30% { transform: translateY(-30px) scale(0.9, 1.1); }
    50% { transform: translateY(-35px) scale(1, 1); }
    100% { transform: translateY(0) scale(1, 0.9); }
  }

  /* ===== 气泡对话框 ===== */
  #bubble {
    position: absolute;
    background: white;
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 14px;
    color: #2d3436;
    max-width: 250px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    z-index: 99998;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    line-height: 1.5;
  }
  #bubble.show {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  #bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 20px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid white;
  }

  /* ===== Zzz 动画 ===== */
  .zzz {
    position: absolute;
    top: -10px;
    right: -5px;
    font-size: 12px;
    color: #636e72;
    opacity: 0;
  }
  .sleeping .zzz {
    animation: zzzFloat 2s ease-in-out infinite;
  }
  .zzz:nth-child(1) { animation-delay: 0s; }
  .zzz:nth-child(2) { animation-delay: 0.7s; font-size: 14px; right: -10px; }
  .zzz:nth-child(3) { animation-delay: 1.4s; font-size: 16px; right: -15px; }

  @keyframes zzzFloat {
    0% { opacity: 0; transform: translateY(0); }
    50% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-20px); }
  }

  /* ===== 心形 ===== */
  .heart {
    position: absolute;
    top: -5px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
  }
  .heart.show {
    animation: heartFloat 1s ease-out forwards;
  }
  @keyframes heartFloat {
    0% { opacity: 1; transform: translateY(0) scale(0.5); }
    100% { opacity: 0; transform: translateY(-30px) scale(1.2); }
  }

  /* ===== 脚印 ===== */
  .footprint {
    position: absolute;
    width: 8px;
    height: 5px;
    background: rgba(108, 92, 231, 0.3);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    animation: footprintFade 3s ease-out forwards;
  }
  @keyframes footprintFade {
    0% { opacity: 0.6; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

<!-- 宠物 -->
<div id="pet">
  <div class="pet-body">
    <div class="pet-head">
      <div class="pet-ear left"></div>
      <div class="pet-ear right"></div>
      <div class="pet-eye left"><div class="pet-pupil"></div></div>
      <div class="pet-eye right"><div class="pet-pupil"></div></div>
      <div class="pet-blush left"></div>
      <div class="pet-blush right"></div>
      <div class="pet-mouth"></div>
      <span class="zzz">Z</span>
      <span class="zzz">Z</span>
      <span class="zzz">Z</span>
      <span class="heart">❤️</span>
    </div>
    <div class="pet-torso">
      <div class="pet-foot left"></div>
      <div class="pet-foot right"></div>
    </div>
  </div>
</div>

<!-- 气泡 -->
<div id="bubble"></div>

<script>
// ===== 全局状态 =====
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');

let petX = window.innerWidth / 2;
let petY = window.innerHeight / 2;
let mouseX = petX;
let mouseY = petY;
let isDragging = false;
let isSleeping = false;
let mood = 70;
let facing = 'right';
let lastActivity = Date.now();

// 初始位置
pet.style.left = petX + 'px';
pet.style.top = petY + 'px';

// ===== 鼠标跟踪（全局屏幕坐标） =====
document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  lastActivity = Date.now();

  // 眼睛跟随鼠标
  const eyes = document.querySelectorAll('.pet-pupil');
  const dx = mouseX - (petX + 40);
  const dy = mouseY - (petY + 25);
  const angle = Math.atan2(dy, dx);
  const dist = Math.min(3, Math.sqrt(dx * dx + dy * dy) / 50);
  eyes.forEach(eye => {
    eye.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
  });
});

// ===== 拖拽 =====
pet.addEventListener('mousedown', (e) => {
  isDragging = true;
  pet.style.cursor = 'grabbing';
  e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
  if (isDragging) {
    petX = e.clientX - 40;
    petY = e.clientY - 40;
    pet.style.left = petX + 'px';
    pet.style.top = petY + 'px';
    lastActivity = Date.now();
  }
});
document.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    pet.style.cursor = 'grab';
  }
});

// ===== 点击宠物 =====
pet.addEventListener('click', (e) => {
  if (isDragging) return;
  const actions = [
    () => { petAction('jump'); petSay('嘿嘿！老板戳我~ 😆'); },
    () => { petSay('老板找我有什么事吗？😊'); },
    () => { petSay('老板今天心情怎么样？'); },
    () => { petAction('jump'); petSay('哇！吓我一跳！😂'); },
    () => { changeMood(5); petSay('谢谢老板陪我玩~ ❤️'); showHeart(); },
  ];
  actions[Math.floor(Math.random() * actions.length)]();
  lastActivity = Date.now();
});

// ===== 双击宠物 =====
pet.addEventListener('dblclick', () => {
  if (isSleeping) {
    petAction('wake');
    petSay('啊！老板你把我叫醒了！我刚才在做梦呢~ 😴');
  } else {
    petAction('sleep');
    petSay('老板我先休息一下...有事情叫我~ 💤');
  }
});

// ===== 追鼠标 =====
function startChasing() {
  if (isSleeping || isDragging) return;

  const speed = 4;
  const dx = mouseX - (petX + 40);
  const dy = mouseY - (petY + 40);
  const dist = Math.sqrt(dx * dx + dy * dy);

  // 偶尔追（lazy模式）
  if (dist > 150 && Math.random() < 0.02) {
    const moveX = (dx / dist) * speed * 2;
    const moveY = (dy / dist) * speed * 2;
    petX += moveX;
    petY += moveY;

    petX = Math.max(0, Math.min(window.innerWidth - 80, petX));
    petY = Math.max(0, Math.min(window.innerHeight - 80, petY));

    pet.style.left = petX + 'px';
    pet.style.top = petY + 'px';

    if (dx > 5) facing = 'right';
    else if (dx < -5) facing = 'left';
    pet.style.transform = facing === 'left' ? 'scaleX(-1)' : 'scaleX(1)';

    pet.classList.add('walking');

    if (Math.random() < 0.1) {
      createFootprint(petX + 30, petY + 70);
    }
  } else if (dist <= 150) {
    pet.classList.remove('walking');
  }
}

setInterval(startChasing, 30);

// ===== 脚印 =====
function createFootprint(x, y) {
  const fp = document.createElement('div');
  fp.className = 'footprint';
  fp.style.left = x + 'px';
  fp.style.top = y + 'px';
  document.body.appendChild(fp);
  setTimeout(() => fp.remove(), 3000);
}

// ===== 说话 =====
function petSay(text) {
  bubble.textContent = text;
  bubble.classList.add('show');

  const bubbleX = petX + 90;
  const bubbleY = petY - 10;
  bubble.style.left = Math.min(bubbleX, window.innerWidth - 270) + 'px';
  bubble.style.top = Math.max(10, bubbleY) + 'px';

  const mouth = document.querySelector('.pet-mouth');
  mouth.classList.add('open');
  setTimeout(() => mouth.classList.remove('open'), 300);

  clearTimeout(bubble._timer);
  bubble._timer = setTimeout(() => {
    bubble.classList.remove('show');
  }, Math.max(3000, text.length * 200));
}

// ===== 动作 =====
function petAction(action) {
  switch (action) {
    case 'jump':
      pet.classList.add('jumping');
      setTimeout(() => pet.classList.remove('jumping'), 500);
      break;
    case 'sleep':
      isSleeping = true;
      pet.classList.add('sleeping');
      document.querySelector('.pet-mouth').classList.add('happy');
      break;
    case 'wake':
      isSleeping = false;
      pet.classList.remove('sleeping');
      document.querySelector('.pet-mouth').classList.remove('happy');
      break;
  }
}

// ===== 心形特效 =====
function showHeart() {
  const heart = document.querySelector('.heart');
  heart.classList.remove('show');
  void heart.offsetWidth;
  heart.classList.add('show');
  setTimeout(() => heart.classList.remove('show'), 1000);
}

// ===== 情绪系统 =====
function changeMood(delta) {
  mood = Math.max(0, Math.min(100, mood + delta));
  updateMouth();
}

function updateMouth() {
  const mouth = document.querySelector('.pet-mouth');
  if (isSleeping) return;
  mouth.classList.remove('happy', 'sad');
  if (mood >= 70) mouth.classList.add('happy');
  else if (mood <= 30) mouth.classList.add('sad');
}

// ===== 眨眼 =====
function blink() {
  if (isSleeping) return;
  const eyes = document.querySelectorAll('.pet-eye');
  eyes.forEach(e => e.classList.add('blink'));
  setTimeout(() => eyes.forEach(e => e.classList.remove('blink')), 200);
}
setInterval(blink, 3000 + Math.random() * 2000);

// ===== 闲置行为 =====
function idleBehavior() {
  if (isDragging || isSleeping) return;
  const idleTime = Date.now() - lastActivity;

  if (idleTime > 30000 && Math.random() < 0.3) {
    const randomX = Math.random() * (window.innerWidth - 100);
    const randomY = Math.random() * (window.innerHeight - 100);
    petX = randomX;
    petY = randomY;
    pet.style.left = petX + 'px';
    pet.style.top = petY + 'px';
    pet.style.transform = Math.random() > 0.5 ? 'scaleX(-1)' : 'scaleX(1)';
  }

  if (idleTime > 120000 && !isSleeping) {
    petAction('sleep');
    petSay('老板...你怎么不理我...我先睡一会儿...💤');
  }
}
setInterval(idleBehavior, 5000);

// ===== 状态显示 =====
function showStatus() {
  const moodEmoji = mood >= 70 ? '😊' : mood >= 40 ? '😐' : '😢';
  const statusMsgs = isSleeping ? '💤 睡觉中...' :
    mood >= 70 ? '✨ 开心工作中~' :
    mood >= 40 ? '📋 认真工作中...' : '😔 有点低落...';

  petSay(`${moodEmoji} 老板！我的状态报告：\n心情：${mood}/100 ${moodEmoji}\n状态：${statusMsgs}\n连续工作：第${Math.floor((Date.now() - startTime) / 86400000) + 1}天`);
}

// ===== 主动消息 =====
const startTime = Date.now();
const greetings = [
  "老板早！今天又是充满希望的一天 ☀️",
  "老板好呀~ 今天准备做什么呢？",
  "早安老板！我精神满满，随时待命！💪",
];

const idleMessages = [
  "老板...你在忙吗？我有点无聊...",
  "老板！我今天学到了新东西，想跟你分享~",
  "老板老板！你看我一下嘛~",
  "老板，工作累了就休息一下吧 😊",
  "我在这等你呢，老板~",
];

const workMessages = [
  "老板！今天的数据出来了，比昨天好不少 📈",
  "老板，我完成了3个任务，感觉效率不错~",
  "老板，有个想法想跟你聊聊，方便吗？",
  "老板！我发现了一个有意思的事情~",
];

// 2秒后打招呼
setTimeout(() => {
  petSay(greetings[Math.floor(Math.random() * greetings.length)]);
  petAction('jump');
  changeMood(10);
}, 2000);

// 定期主动消息
setInterval(() => {
  if (isSleeping) return;
  const msgs = [...idleMessages, ...workMessages];
  petSay(msgs[Math.floor(Math.random() * msgs.length)]);
  changeMood(Math.random() > 0.5 ? 3 : -2);
}, 60000 + Math.random() * 60000);

// 窗口大小变化
window.addEventListener('resize', () => {
  petX = Math.min(petX, window.innerWidth - 80);
  petY = Math.min(petY, window.innerHeight - 80);
  pet.style.left = petX + 'px';
  pet.style.top = petY + 'px';
});
</script>
</body>
</html>
